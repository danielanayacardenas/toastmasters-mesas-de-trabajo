name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Biome Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install
      - run: bun run format:check
        # format:check = biome check . (lint + format + imports sin escribir)
        # usa biome.json: formatter 4 spaces, 100 width, double quotes
      - run: bun run build
